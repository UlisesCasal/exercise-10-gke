apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: node-registry
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "noderegistry"
            - name: POSTGRES_PASSWORD
              value: "noderegistry"
            - name: POSTGRES_DB
              value: "noderegistry"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
